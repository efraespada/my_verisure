# Services for My Verisure integration

# Arm the alarm in away mode
arm_away:
  name: "Arm Alarm Away"
  description: "Arm the alarm in away mode (total)"
  fields:
    installation_id:
      name: "Installation ID"
      description: "The installation ID to arm"
      required: true
      selector:
        text:

# Arm the alarm in home mode
arm_home:
  name: "Arm Alarm Home"
  description: "Arm the alarm in home mode (perimeter)"
  fields:
    installation_id:
      name: "Installation ID"
      description: "The installation ID to arm"
      required: true
      selector:
        text:

# Arm the alarm in night mode
arm_night:
  name: "Arm Alarm Night"
  description: "Arm the alarm in night mode"
  fields:
    installation_id:
      name: "Installation ID"
      description: "The installation ID to arm"
      required: true
      selector:
        text:

# Disarm the alarm
disarm:
  name: "Disarm Alarm"
  description: "Disarm the alarm"
  fields:
    installation_id:
      name: "Installation ID"
      description: "The installation ID to disarm"
      required: true
      selector:
        text:
# Get alarm status
get_status:
  name: "Get Alarm Status"
  description: "Refresh the alarm status"
  fields:
    installation_id:
      name: "Installation ID"
      description: "The installation ID to get status for"
      required: true
      selector:
        text:

# Refresh camera images
refresh_camera_images:
  name: "Refresh Camera Images"
  description: "Download fresh thumbnails from Verisure cameras"
  fields:
    installation_id:
      name: "Installation ID"
      description: "The installation ID to refresh cameras for"
      required: true
      selector:
        text:
    camera_entity_id:
      name: "Camera"
      description: "Refresh only this camera. Leave empty to refresh all cameras."
      required: false
      selector:
        entity:
          integration: my_verisure
          domain: camera
