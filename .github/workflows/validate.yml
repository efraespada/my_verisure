name: Validate with HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Select configured Python interpreter
        run: echo "HA_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Run pinned Home Assistant suite
        run: make test-ha-2026-8

      - name: Run complete type gate
        run: make type-check

      - name: Run critical lint gate
        run: make lint-critical

      - name: Run architecture and dependency gates
        run: make git-check

      - name: Run contextual coverage
        run: make coverage

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"
