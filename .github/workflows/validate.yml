name: Validate with HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q cli custom_components

      - name: Check architecture bootstrap
        run: python scripts/architecture_guard.py

      - name: Run integration smoke tests
        run: python -m pytest custom_components/my_verisure/tests -q

      - name: Run Core unit tests
        run: python -m pytest custom_components/my_verisure/core/tests/unit -q

      - name: Run CLI entry-point tests
        run: python -m pytest cli/tests/test_cli.py cli/tests/test_integration.py -q

      - name: Run critical Flake8 checks
        run: python -m flake8 --select=E9,F63,F7,F82 cli custom_components scripts

      - name: Run incremental type gate
        run: >-
          python -m mypy --explicit-package-bases --ignore-missing-imports
          --follow-imports=skip
          custom_components/my_verisure/core/api/mappers/*.py
          custom_components/my_verisure/core/api/models/domain/*.py
          custom_components/my_verisure/core/api/models/dto/*.py
          --no-incremental

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"
