name: Validate with HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ha-2026.11.txt

      - name: Install primary development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Select configured Python interpreter
        run: echo "HA_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Run current Home Assistant suite
        run: make test-ha-2026-11

      - name: Run complete type gate
        run: make type-check

      - name: Run critical lint gate
        run: make lint-critical

      - name: Run architecture and documentation gates
        run: make git-check

      - name: Validate distribution artifact
        run: make distribution-check

      - name: Run contextual coverage
        run: make coverage

      - name: Audit current runtime dependency closure
        run: |
          python scripts/export_runtime_requirements.py > /tmp/my-verisure-runtime-requirements.txt
          uv tool run --from pip-audit pip-audit --no-deps --disable-pip -r /tmp/my-verisure-runtime-requirements.txt --progress-spinner off

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"
