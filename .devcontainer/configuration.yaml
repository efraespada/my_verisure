# Home Assistant Development Configuration
# This configuration is used in the devcontainer

# Load default integrations
default_config:

# Logger configuration for debugging
logger:
  default: info
  logs:
    # Your custom integration logs
    custom_components.my_verisure: debug
    my_verisure: debug
    # Home Assistant core logs (set to warning to reduce noise)
    homeassistant.core: warning
    homeassistant.components: warning

# HTTP server configuration
http:
  server_port: 8123
  server_host: 0.0.0.0

# Recorder (optional - comment out if you don't need history)
recorder:
  db_url: "sqlite:////tmp/home-assistant_v2.db"
  purge_keep_days: 2

# Enable the frontend
frontend:

# Enable hassio panel (if you need supervisor features)
# hassio:

# Example automation for testing
automation: !include automations.yaml

# Example scenes
scene: !include scenes.yaml

# Example scripts
script: !include scripts.yaml
